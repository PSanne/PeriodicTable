<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodensystem der Elemente – interaktiv</title>
<meta name="description" content="Interaktives Periodensystem: Klicke auf ein Element, um Atommodell, Entdecker, Atommasse, Schmelz- und Siedepunkt und wichtige Verbindungen zu sehen.">
<style>
/* =========================================================
   1. Farben & Themes
   ========================================================= */
:root {
  --radius: 8px;
  --gap: 4px;
  --flip: 0.6s;
}
[data-theme="dark"] {
  --bg: #0f1420;
  --bg2: #171e2e;
  --panel: #1d2538;
  --text: #e8ecf4;
  --muted: #9aa5bd;
  --border: #2c3650;
  --shadow: 0 10px 40px rgba(0,0,0,.55);
  --c-am: #e8575a; --c-ae: #f29b4b; --c-tm: #e9c46a; --c-pt: #8ab17d;
  --c-md: #4fb3a9; --c-nm: #4f9de8; --c-ha: #9b8cf2; --c-ng: #d97ad9;
  --c-la: #f2789f; --c-ac: #c9707c; --c-uk: #7d8597;
  --tile-text: #111;
  --s-solid: #8d99ae; --s-liquid: #4f9de8; --s-gas: #f2c14b; --s-unknown: #3a4357;
}
[data-theme="light"] {
  --bg: #f6f7fb;
  --bg2: #ffffff;
  --panel: #ffffff;
  --text: #1d2433;
  --muted: #5d6780;
  --border: #d9deea;
  --shadow: 0 10px 40px rgba(30,40,70,.18);
  --c-am: #ffb3b0; --c-ae: #ffd3a6; --c-tm: #fbe7a1; --c-pt: #c8e3bd;
  --c-md: #b4e3dc; --c-nm: #b9d8fb; --c-ha: #d6cffb; --c-ng: #f1c8f1;
  --c-la: #ffc9da; --c-ac: #eec2c8; --c-uk: #dde1e9;
  --tile-text: #1d2433;
  --s-solid: #c3cad8; --s-liquid: #9cc8f7; --s-gas: #fde08a; --s-unknown: #eceff5;
}

/* =========================================================
   2. Grundlayout
   ========================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .3s, color .3s;
}
.pse-app { max-width: 1400px; margin: 0 auto; padding: 16px; }
header.pse-head {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
header.pse-head h1 { font-size: clamp(1.2rem, 2.4vw, 1.8rem); margin: 0; }
header.pse-head p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar input[type="search"] {
  padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); min-width: 220px; font-size: .95rem;
}
button.btn {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); cursor: pointer; font-size: .9rem;
}
button.btn:hover { border-color: var(--muted); }
button.btn[aria-pressed="true"] { background: var(--text); color: var(--bg); }

/* Temperatur-Slider */
.temp-box {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; margin-bottom: 12px;
}
.temp-box label { font-weight: 600; }
.temp-box input[type="range"] { flex: 1 1 260px; accent-color: #e8575a; }
.temp-val { font-variant-numeric: tabular-nums; min-width: 190px; }
.state-legend { display: none; gap: 12px; font-size: .85rem; color: var(--muted); }
.state-mode .state-legend { display: flex; }
.state-legend span::before {
  content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
  margin-right: 5px; vertical-align: -2px; background: var(--sw);
}

/* =========================================================
   3. Periodensystem-Raster
   ========================================================= */
.table-wrap { overflow-x: auto; padding-bottom: 6px; }
.pse {
  display: grid;
  grid-template-columns: repeat(18, minmax(48px, 1fr));
  grid-template-rows: repeat(7, auto) 14px repeat(2, auto);
  gap: var(--gap);
  min-width: 900px;
  position: relative;
}
.tile {
  aspect-ratio: 1 / 1.08;
  perspective: 700px;
  cursor: pointer;
  border: none; padding: 0; background: none; font: inherit; color: inherit;
  transition: opacity .25s, transform .2s;
}
.tile:hover { transform: translateY(-2px); z-index: 2; }
.tile:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; border-radius: var(--radius); }
.tile-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform var(--flip) cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
}
.tile.flipped .tile-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: 6px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--cat); color: var(--tile-text);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 3px; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.face .z { position: absolute; top: 3px; left: 5px; font-size: .62rem; font-weight: 600; opacity: .8; }
.face .sym { font-size: clamp(.95rem, 1.6vw, 1.4rem); font-weight: 800; line-height: 1; }
.face .nm { font-size: clamp(.45rem, .72vw, .64rem); margin-top: 3px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.face .ms { font-size: clamp(.42rem, .62vw, .58rem); opacity: .75; }
.face.back { transform: rotateY(180deg); font-size: .55rem; text-align: center; gap: 1px; }
.face.back b { font-size: .8rem; }
.state-dot {
  position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--sdot, transparent); display: none;
}
.state-mode .state-dot { display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.state-mode .tile .face.front { background: var(--sbg); }

.tile.dim { opacity: .18; }
.tile.hit .face.front { box-shadow: 0 0 0 3px var(--text); }

.placeholder {
  border: 1px dashed var(--border); border-radius: 6px; display: flex; align-items: center;
  justify-content: center; text-align: center; font-size: .6rem; color: var(--muted);
}

/* Gruppen-Nummern */
.gnum { text-align: center; font-size: .65rem; color: var(--muted); align-self: end; }

/* Legende im Raster oben */
.legend {
  grid-column: 3 / 13; grid-row: 1 / 3; align-self: center;
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 6px;
}
.legend button {
  border: 1px solid var(--border); background: var(--bg2); color: var(--text);
  border-radius: 999px; padding: 4px 10px 4px 6px; font-size: .72rem; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.legend button::before {
  content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--sw);
}
.legend button[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.legend-hint { width: 100%; text-align: center; font-size: .7rem; color: var(--muted); }

/* =========================================================
   4. Vergrößerte Detailkarte (Overlay)
   ========================================================= */
.overlay {
  position: fixed; inset: 0; background: rgba(5,8,15,.6);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 100;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.card {
  width: min(880px, 100%); height: min(90vh, 760px);
  perspective: 1600px;
}
.card-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.4,.2,.2,1);
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; border-radius: 16px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: var(--shadow);
}
.card-front {
  background: var(--cat); color: var(--tile-text);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.card-front .big-z { font-size: 2rem; font-weight: 700; opacity: .8; }
.card-front .big-sym { font-size: 9rem; font-weight: 800; line-height: 1; }
.card-front .big-name { font-size: 2rem; }
.card-back {
  transform: rotateY(180deg);
  background: var(--panel); color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
  border-top: 10px solid var(--cat);
}
.card-head {
  display: flex; align-items: center; gap: 16px; padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.card-head .chip {
  width: 70px; height: 76px; border-radius: 10px; background: var(--cat); color: var(--tile-text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none;
}
.card-head .chip b { font-size: 1.9rem; line-height: 1; }
.card-head .chip small { font-size: .7rem; }
.card-head h2 { margin: 0; font-size: 1.6rem; }
.card-head .sub { color: var(--muted); font-size: .9rem; }
.card-close {
  margin-left: auto; align-self: flex-start;
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); font-size: 1.2rem; cursor: pointer;
}
.card-nav { display: flex; gap: 6px; align-self: flex-start; }
.card-body {
  flex: 1; overflow-y: auto; padding: 16px 20px 20px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
}
.model-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.model-switch { display: flex; gap: 6px; }
.model-switch button { font-size: .8rem; padding: 5px 12px; }
.model-view { width: 100%; display: flex; justify-content: center; align-items: center; min-height: 300px; }
.model-view svg { width: 100%; max-width: 330px; height: auto; }
.config { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; text-align: center; }
.config sup { font-size: .7em; }
.shells-txt { font-size: .8rem; color: var(--muted); text-align: center; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-content: start; font-size: .93rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }
.facts .note { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-style: italic; }
.compounds { grid-column: 1 / -1; }
.compounds h3 { margin: 4px 0 8px; font-size: 1rem; }
.compounds ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.compounds li {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px; font-size: .88rem;
}

/* Bohr-Animation */
.shell-ring { fill: none; stroke: var(--border); stroke-width: 1; }
.electron { fill: #4f9de8; }
[data-theme="light"] .electron { fill: #2a6fc4; }
.nucleus { fill: var(--cat); stroke: rgba(0,0,0,.25); }
.nucleus-txt { fill: var(--tile-text); font-weight: 800; font-family: inherit; }
.orbit { transform-origin: 0 0; animation: spin linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Orbitalschema */
.orbitals { display: flex; flex-direction: column-reverse; gap: 6px; width: fit-content; margin: 0 auto; padding: 4px; }
.orb-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.orb-row { display: flex; align-items: center; gap: 8px; }
.orb-row .lbl { width: 30px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; text-align: right; color: var(--muted); }
.orb-boxes { display: flex; }
.orb-box {
  width: 26px; height: 26px; border: 1.5px solid var(--text); margin-left: -1.5px;
  display: flex; align-items: center; justify-content: center; font-size: .9rem; line-height: 1;
  letter-spacing: -2px;
}
.orb-box:first-child { margin-left: 0; }
.orb-legend { font-size: .75rem; color: var(--muted); text-align: center; }

@media (max-width: 720px) {
  .card-body { grid-template-columns: 1fr; }
  .card-front .big-sym { font-size: 6rem; }
  .card { height: 92vh; }
  .card-head { flex-wrap: wrap; padding: 12px 14px; gap: 10px; }
  .card-head > div:nth-child(2) { flex: 1 1 150px; }
  .card-head h2 { font-size: 1.3rem; }
  .card-nav { order: 3; }
  .card-close { order: 2; }
  .card-body { padding: 12px 14px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .orbit { animation: none; }
  .tile-inner, .card-inner { transition-duration: .01s; }
}
footer.pse-foot { margin-top: 14px; color: var(--muted); font-size: .75rem; text-align: center; }
</style>
</head>
<body>
<div class="pse-app" id="app">
  <header class="pse-head">
    <div>
      <h1>Periodensystem der Elemente</h1>
      <p>Klicke auf ein Element: Die Kachel dreht sich um und zeigt dir alle Details.</p>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Suche: Name, Symbol oder Nr." aria-label="Element suchen">
      <button class="btn" id="stateToggle" aria-pressed="false" title="Aggregatzustand bei gewählter Temperatur anzeigen">🌡️ Aggregatzustand</button>
      <button class="btn" id="themeToggle" title="Hell/Dunkel umschalten">🌙 Dunkel</button>
    </div>
  </header>

  <div class="temp-box" id="tempBox">
    <label for="temp">Temperatur:</label>
    <input type="range" id="temp" min="0" max="6000" step="1" value="293">
    <span class="temp-val" id="tempVal"></span>
    <div class="state-legend">
      <span style="--sw:var(--s-solid)">fest</span>
      <span style="--sw:var(--s-liquid)">flüssig</span>
      <span style="--sw:var(--s-gas)">gasförmig</span>
      <span style="--sw:var(--s-unknown)">unbekannt</span>
    </div>
  </div>

  <div class="table-wrap">
    <div class="pse" id="pse"></div>
  </div>

  <footer class="pse-foot">
    Werte gerundet; Schmelz-/Siedepunkte bei Normaldruck. „ca.“ = geschätzt bzw. vorhergesagt. Massen in [ ] = Massenzahl des langlebigsten Isotops.
  </footer>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <div class="card-inner">
      <div class="card-face card-front" id="cardFront"></div>
      <div class="card-face card-back" id="cardBack"></div>
    </div>
  </div>
</div>

/* =========================================================
   6. Hilfsfunktionen: Werte, Position, Elektronenkonfiguration
   ========================================================= */
function parseVal(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "string" && v.startsWith("~")) return { k: parseFloat(v.slice(1)), est: true };
  return { k: v, est: false };
}
const fmt = (n, d) => n.toLocaleString("de-DE", { maximumFractionDigits: d, minimumFractionDigits: 0 });
function fmtTemp(p) {
  if (!p) return "unbekannt";
  const c = p.k - 273.15;
  return (p.est ? "ca. " : "") + fmt(c, 2) + " °C (" + fmt(p.k, 2) + " K)";
}

const PERIOD_START = [1, 3, 11, 19, 37, 55, 87, 119];
function position(z) {
  let p = 0; while (z >= PERIOD_START[p + 1]) p++;
  const period = p + 1, i = z - PERIOD_START[p];
  if (period === 1) return { period, group: z === 1 ? 1 : 18, row: 1, col: z === 1 ? 1 : 18 };
  if (period <= 3) { const g = i < 2 ? i + 1 : i + 11; return { period, group: g, row: period, col: g }; }
  if (period <= 5) return { period, group: i + 1, row: period, col: i + 1 };
  if (i < 2) return { period, group: i + 1, row: period, col: i + 1 };
  if (i <= 16) return { period, group: 3, row: period === 6 ? 9 : 10, col: i + 1, f: true };
  const g = i - 13; return { period, group: g, row: period, col: g };
}

const ORDER = ["1s","2s","2p","3s","3p","4s","3d","4p","5s","4d","5p","6s","4f","5d","6p","7s","5f","6d","7p"];
const CAP = { s: 2, p: 6, d: 10, f: 14 };
// Ausnahmen von der Madelung-Regel (tatsächliche Grundzustände)
const EXC = {
  24:{"4s":-1,"3d":1}, 29:{"4s":-1,"3d":1}, 41:{"5s":-1,"4d":1}, 42:{"5s":-1,"4d":1},
  44:{"5s":-1,"4d":1}, 45:{"5s":-1,"4d":1}, 46:{"5s":-2,"4d":2}, 47:{"5s":-1,"4d":1},
  57:{"4f":-1,"5d":1}, 58:{"4f":-1,"5d":1}, 64:{"4f":-1,"5d":1},
  78:{"6s":-1,"5d":1}, 79:{"6s":-1,"5d":1},
  89:{"5f":-1,"6d":1}, 90:{"5f":-2,"6d":2}, 91:{"5f":-1,"6d":1}, 92:{"5f":-1,"6d":1},
  93:{"5f":-1,"6d":1}, 96:{"5f":-1,"6d":1}, 103:{"6d":-1,"7p":1}
};
function configOf(z) {
  const occ = {}; let left = z;
  for (const o of ORDER) { if (!left) break; const n = Math.min(CAP[o[1]], left); occ[o] = n; left -= n; }
  const ex = EXC[z];
  if (ex) for (const o in ex) { occ[o] = (occ[o] || 0) + ex[o]; if (!occ[o]) delete occ[o]; }
  return occ;
}
// Sortierung nach Schale, dann Unterschale (für die Anzeige)
const L_ORDER = "spdf";
function sortedOrbitals(occ) {
  return Object.keys(occ).sort((a, b) => (a[0] - b[0]) || (L_ORDER.indexOf(a[1]) - L_ORDER.indexOf(b[1])));
}
const NOBLE = [[86,"Rn"],[54,"Xe"],[36,"Kr"],[18,"Ar"],[10,"Ne"],[2,"He"]];
function configString(z) {
  const occ = configOf(z);
  let coreZ = 0, coreSym = "";
  for (const [nz, s] of NOBLE) if (nz < z) { coreZ = nz; coreSym = s; break; }
  const core = coreZ ? configOf(coreZ) : {};
  // Reihenfolge wie üblich: nach Schale sortiert
  const orderShown = sortedOrbitals(occ).filter(o => !(core[o] && core[o] === occ[o]));
  return (coreSym ? "[" + coreSym + "] " : "") + orderShown.map(o => o + "<sup>" + occ[o] + "</sup>").join(" ");
}
function shellsOf(z) {
  const occ = configOf(z), sh = [];
  for (const o in occ) { const n = +o[0]; sh[n - 1] = (sh[n - 1] || 0) + occ[o]; }
  for (let i = 0; i < sh.length; i++) sh[i] = sh[i] || 0;
  return sh;
}

const ELEMENTS = RAW.map(r => {
  const e = {
    z: r[0], sym: r[1], name: r[2], mass: r[3], cat: r[4],
    mp: parseVal(r[5]), bp: parseVal(r[6]), en: r[7],
    disc: r[8], year: r[9], comps: r[10].split(";"), extra: r[11] || {}
  };
  Object.assign(e, position(e.z));
  return e;
});

function stateAt(e, T) {
  if (e.extra.sub) return T < e.extra.sub ? "solid" : "gas";
  const mp = e.mp && e.mp.k, bp = e.bp && e.bp.k;
  if (mp == null && bp == null) return "unknown";
  if (mp == null) return T < bp ? "liquid" : "gas";        // Helium
  if (T < mp) return "solid";
  if (bp == null) return "unknown";
  return T < bp ? "liquid" : "gas";
}

const STATE_VAR = { solid: "var(--s-solid)", liquid: "var(--s-liquid)", gas: "var(--s-gas)", unknown: "var(--s-unknown)" };

    b.type = "button"; b.textContent = CATS[key]; b.dataset.cat = key;
    b.style.setProperty("--sw", `var(--c-${key})`);
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => toggleCat(key, b));
    legend.appendChild(b);
  }
  const hint = document.createElement("div");
  hint.className = "legend-hint"; hint.textContent = "Klicke auf eine Gruppe, um sie hervorzuheben";
  legend.appendChild(hint);
  pse.appendChild(legend);

  // Platzhalter für Lanthanoide/Actinoide
  [[6, "57–71", "Lanthanoide"], [7, "89–103", "Actinoide"]].forEach(([row, range, label]) => {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.style.gridRow = row; ph.style.gridColumn = 3;
    ph.innerHTML = range + "<br>" + label;
    pse.appendChild(ph);
  });

  for (const e of ELEMENTS) {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tile";
    t.style.gridRow = e.row; t.style.gridColumn = e.col;
    t.style.setProperty("--cat", `var(--c-${e.cat})`);
    t.setAttribute("aria-label", `${e.name} (${e.sym}), Ordnungszahl ${e.z}`);
    t.innerHTML = `
      <div class="tile-inner">
        <div class="face front">
          <span class="z">${e.z}</span><span class="state-dot"></span>
          <span class="sym">${e.sym}</span>
          <span class="nm">${e.name}</span>
          <span class="ms">${typeof e.mass === "number" ? fmt(e.mass, 3) : e.mass}</span>
        </div>
        <div class="face back">
          <b>${e.sym}</b>
          <span>${shellsOf(e.z).join("-")}</span>
          <span>Details …</span>
        </div>
      </div>`;
    t.addEventListener("click", () => openElement(e));
    pse.appendChild(t);
    tiles.set(e.z, t);
  }
}

/* =========================================================
   8. Suche, Gruppen-Filter, Temperatur
   ========================================================= */
let activeCat = null;
function toggleCat(key, btn) {
  activeCat = activeCat === key ? null : key;
  document.querySelectorAll(".legend button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === activeCat));
  applyFilter();
}
const search = document.getElementById("search");
search.addEventListener("input", applyFilter);
search.addEventListener("keydown", ev => {
  if (ev.key === "Enter") {
    const hit = ELEMENTS.find(e => matches(e, search.value.trim().toLowerCase()));
    if (hit) openElement(hit);
  }
});
function matches(e, q) {
  if (!q) return true;
  return e.name.toLowerCase().includes(q) || e.sym.toLowerCase() === q || String(e.z) === q;
}
function applyFilter() {
  const q = search.value.trim().toLowerCase();
  for (const e of ELEMENTS) {
    const t = tiles.get(e.z);
    const ok = matches(e, q) && (!activeCat || e.cat === activeCat);
    t.classList.toggle("dim", !ok);
    t.classList.toggle("hit", !!q && ok);
  }
}

const app = document.getElementById("app");
const tempIn = document.getElementById("temp"), tempVal = document.getElementById("tempVal");
const stateBtn = document.getElementById("stateToggle");
function updateTemp() {
  const T = +tempIn.value;
  tempVal.textContent = `${fmt(T, 0)} K = ${fmt(T - 273.15, 2)} °C`;
  for (const e of ELEMENTS) {
    const s = stateAt(e, T), t = tiles.get(e.z);
    t.style.setProperty("--sbg", STATE_VAR[s]);
    t.style.setProperty("--sdot", STATE_VAR[s]);
    t.title = `${e.name}: bei ${fmt(T - 273.15, 0)} °C ${STATE_DE[s]}`;
  }
}
tempIn.addEventListener("input", () => { if (!app.classList.contains("state-mode")) setStateMode(true); updateTemp(); });
function setStateMode(on) {
  app.classList.toggle("state-mode", on);
  stateBtn.setAttribute("aria-pressed", on);
}
stateBtn.addEventListener("click", () => setStateMode(!app.classList.contains("state-mode")));

/* =========================================================
   9. Theme hell/dunkel
   ========================================================= */
const themeBtn = document.getElementById("themeToggle");
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "☀️ Hell" : "🌙 Dunkel";
  try { localStorage.setItem("pse-theme", t); } catch (_) {}
}
themeBtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* =========================================================
   10. Atommodelle
   ========================================================= */
function bohrSVG(e) {
  const sh = shellsOf(e.z);
  const size = 340, c = size / 2, r0 = 30, step = (c - r0 - 12) / sh.length;
  let s = `<svg viewBox="${-c} ${-c} ${size} ${size}" role="img" aria-label="Bohrsches Atommodell von ${e.name}">`;
  sh.forEach((n, i) => {
    const r = r0 + step * (i + 1);
    s += `<circle class="shell-ring" r="${r}"/>`;
    const dur = 6 + i * 4, dir = i % 2 ? "reverse" : "normal";
    s += `<g class="orbit" style="animation-duration:${dur}s;animation-direction:${dir}">`;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      s += `<circle class="electron" r="${n > 18 ? 2.6 : 3.6}" cx="${(Math.cos(a) * r).toFixed(2)}" cy="${(Math.sin(a) * r).toFixed(2)}"/>`;
    }
    s += `</g>`;
  });
  s += `<circle class="nucleus" r="${r0 - 4}"/>`;
  s += `<text class="nucleus-txt" text-anchor="middle" dy="-2" font-size="16">${e.sym}</text>`;
  s += `<text class="nucleus-txt" text-anchor="middle" dy="13" font-size="9">${e.z} p⁺</text>`;
  return s + `</svg>`;
}
function orbitalHTML(e) {
  const occ = configOf(e.z);
  const boxesPer = { s: 1, p: 3, d: 5, f: 7 };
  // Energieordnung (Madelung), unten = niedrigste Energie
  let h = `<div class="orb-wrap"><div class="orbitals">`;
  for (const o of ORDER) {
    if (!occ[o]) continue;
    const nb = boxesPer[o[1]], n = occ[o];
    const boxes = [];
    for (let b = 0; b < nb; b++) {
      // Hundsche Regel: erst jedes Kästchen einfach, dann doppelt besetzen
      const up = n > b, down = n > nb + b;
      boxes.push(`<div class="orb-box">${up ? "↑" : ""}${down ? "↓" : ""}</div>`);
    }
    h += `<div class="orb-row"><span class="lbl">${o}</span><div class="orb-boxes">${boxes.join("")}</div></div>`;
  }
  return h + `</div><div class="orb-legend">Unten: niedrigste Energie · Hundsche Regel &amp; Pauli-Prinzip</div></div>`;
}

/* =========================================================
   11. Detailkarte öffnen / schließen
   ========================================================= */
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const cardFront = document.getElementById("cardFront");
const cardBack = document.getElementById("cardBack");
let current = null, modelMode = "bohr", openTimer = null, lastFocus = null;

function renderBack(e) {
  const T = 293.15;
  const groupTxt = e.f ? `${e.period} (${e.cat === "la" ? "Lanthanoid" : "Actinoid"})` : e.group;
  const block = (() => { const occ = configOf(e.z); let last = null; for (const o of ORDER) if (occ[o]) last = o; return last ? last[1] : "s"; })();
  cardBack.innerHTML = `
    <div class="card-head">
      <div class="chip"><small>${e.z}</small><b>${e.sym}</b><small>${typeof e.mass === "number" ? fmt(e.mass, 3) : e.mass}</small></div>
      <div>
        <h2 id="cardTitle">${e.name}</h2>
        <div class="sub">${CATS[e.cat]} · Gruppe ${e.f ? "–" : e.group} · Periode ${e.period} · ${block}-Block</div>
      </div>
      <div class="card-nav">
        <button class="btn" type="button" data-nav="-1" title="Vorheriges Element" aria-label="Vorheriges Element">‹</button>
        <button class="btn" type="button" data-nav="1" title="Nächstes Element" aria-label="Nächstes Element">›</button>
      </div>
      <button class="card-close" type="button" aria-label="Schließen" title="Schließen (Esc)">✕</button>
    </div>
    <div class="card-body">
      <div class="model-box">
        <div class="model-switch">
          <button class="btn" type="button" data-model="bohr" aria-pressed="${modelMode === "bohr"}">Bohr-Modell</button>
          <button class="btn" type="button" data-model="orb" aria-pressed="${modelMode === "orb"}">Orbitalschema</button>
        </div>
        <div class="model-view" id="modelView"></div>
        <div class="config">${configString(e.z)}</div>
        <div class="shells-txt">Elektronen pro Schale: ${shellsOf(e.z).map((n, i) => "KLMNOPQ"[i] + " " + n).join(" · ")}</div>
      </div>
      <dl class="facts">
        <dt>Ordnungszahl</dt><dd>${e.z}</dd>
        <dt>Atommasse</dt><dd>${massTxt(e)}</dd>
        <dt>Schmelzpunkt</dt><dd>${e.extra.sub ? "– (sublimiert)" : fmtTemp(e.mp)}</dd>
        <dt>Siedepunkt</dt><dd>${e.extra.sub ? "– (sublimiert)" : fmtTemp(e.bp)}</dd>
        <dt>Zustand bei 20 °C</dt><dd>${STATE_DE[stateAt(e, T)]}</dd>
        <dt>Elektronegativität</dt><dd>${e.en != null ? fmt(e.en, 2) : "–"}</dd>
        <dt>Entdecker</dt><dd>${e.disc}</dd>
        <dt>Entdeckung</dt><dd>${e.year}</dd>
        ${e.extra.note ? `<div class="note">ℹ️ ${e.extra.note}</div>` : ""}
      </dl>
      <div class="compounds">
        <h3>Wichtige Verbindungen</h3>
        <ul>${e.comps.map(c => `<li>${c}</li>`).join("")}</ul>
      </div>
    </div>`;
  renderModel(e);
  cardBack.querySelector(".card-close").addEventListener("click", closeElement);
  cardBack.querySelectorAll("[data-model]").forEach(b => b.addEventListener("click", () => {
    modelMode = b.dataset.model;
    cardBack.querySelectorAll("[data-model]").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderModel(e);
  }));
  cardBack.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
    const z = ((e.z - 1 + +b.dataset.nav + 118) % 118) + 1;
    switchTo(ELEMENTS[z - 1]);
  }));
}
function renderModel(e) {
  const v = cardBack.querySelector("#modelView");
  v.innerHTML = modelMode === "bohr" ? bohrSVG(e) : orbitalHTML(e);
}
function setCardColor(e) { card.style.setProperty("--cat", `var(--c-${e.cat})`); }

function openElement(e) {
  lastFocus = document.activeElement;
  if (current) tiles.get(current.z).classList.remove("flipped");
  current = e;
  tiles.get(e.z).classList.add("flipped");     // kleine Kachel dreht sich um
  setCardColor(e);
  cardFront.innerHTML = `<div class="big-z">${e.z}</div><div class="big-sym">${e.sym}</div><div class="big-name">${e.name}</div>`;
  renderBack(e);
  card.classList.remove("flipped");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  clearTimeout(openTimer);
  openTimer = setTimeout(() => {               // große Karte dreht sich auf die Rückseite
    card.classList.add("flipped");
    const c = cardBack.querySelector(".card-close"); if (c) c.focus({ preventScroll: true });
  }, 380);
}
function switchTo(e) {
  tiles.get(current.z).classList.remove("flipped");
  current = e;
  tiles.get(e.z).classList.add("flipped");
  setCardColor(e);
  cardFront.innerHTML = `<div class="big-z">${e.z}</div><div class="big-sym">${e.sym}</div><div class="big-name">${e.name}</div>`;
  renderBack(e);
}
function closeElement() {
  if (!current) return;
  clearTimeout(openTimer);
  card.classList.remove("flipped");
  const t = tiles.get(current.z);
  setTimeout(() => {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    t.classList.remove("flipped");
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }, 450);
  current = null;
}
overlay.addEventListener("click", ev => { if (ev.target === overlay) closeElement(); });
document.addEventListener("keydown", ev => {
  if (!current) return;
  if (ev.key === "Escape") closeElement();
  if (ev.key === "ArrowRight") switchTo(ELEMENTS[current.z % 118]);
  if (ev.key === "ArrowLeft") switchTo(ELEMENTS[(current.z + 116) % 118]);
});

/* =========================================================
   12. Start
   ========================================================= */
build();
let savedTheme = null;
try { savedTheme = localStorage.getItem("pse-theme"); } catch (_) {}
const urlTheme = new URLSearchParams(location.search).get("theme");
setTheme(urlTheme || savedTheme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
updateTemp();
</script>
</body>
</html>
